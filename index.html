<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0500" />
    <title>Bank Robbery Slot</title>
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #0a0500;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        display: block;
        touch-action: none;
        /* crisp pixel rendering on mobile */
        image-rendering: auto;
      }

      /* ── Rotate overlay (portrait only) ─────────────────────── */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0a0500;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
        color: #ffd700;
        font-family: Arial Black, Impact, sans-serif;
        text-align: center;
      }

      #rotate-overlay svg {
        width: 80px;
        height: 80px;
        fill: #ffd700;
        animation: spin-hint 2s ease-in-out infinite;
      }

      #rotate-overlay p {
        font-size: clamp(16px, 5vw, 22px);
        color: #ffa500;
        max-width: 280px;
        line-height: 1.5;
      }

      @keyframes spin-hint {
        0%   { transform: rotate(0deg); }
        40%  { transform: rotate(90deg); }
        60%  { transform: rotate(90deg); }
        100% { transform: rotate(90deg); }
      }

      /* Show overlay only when truly portrait on small screens */
      @media screen and (orientation: portrait) and (max-width: 900px) {
        #rotate-overlay { display: flex; }
        canvas           { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- Rotate-device overlay (portrait phones/tablets) -->
    <div id="rotate-overlay">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M16.5 1.5A4.5 4.5 0 0 1 21 6v4h-2V6a2.5 2.5 0 0 0-2.5-2.5H7.5A2.5 2.5 0 0 0 5 6v12a2.5 2.5 0 0 0 2.5 2.5H10v2H7.5A4.5 4.5 0 0 1 3 18V6a4.5 4.5 0 0 1 4.5-4.5h9ZM13 13l5 5-5 5v-3H8v-4h5v-3Z"/>
      </svg>
      <p>Gire o dispositivo para<br/><strong>modo paisagem</strong><br/>para jogar</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
